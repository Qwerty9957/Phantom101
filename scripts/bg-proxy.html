<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bg</title>
    <script src="../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.2/dist/index.js" defer></script>
</head>

<body>
    <script>
        const DEFAULT_WISP = window.SITE_CONFIG?.defaultWisp || "wss://glseries.net/wisp/";
        let transportInstance = null;
        let initPromise = null;

        function resolveWisp() {
            try {
                const s = JSON.parse(localStorage.getItem('void_settings') || '{}');
                if (s.proxServer) return s.proxServer;
            } catch { }
            return localStorage.getItem("proxServer") || DEFAULT_WISP;
        }

        async function ensureTransport() {
            if (transportInstance) return transportInstance;
            if (initPromise) return initPromise;

            initPromise = (async () => {
                let retries = 0;
                while (!window.EpoxyTransport && retries < 50) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }

                if (!window.EpoxyTransport) {
                    throw new Error('EpoxyTransport not ready');
                }

                const Transport = window.EpoxyTransport?.default || window.EpoxyTransport;
                transportInstance = new Transport({ wisp: resolveWisp() });
                await transportInstance.init();

                return transportInstance;
            })();

            return initPromise;
        }

        async function proxyImage(url, requestId) {
            try {
                const transport = await ensureTransport();
                const res = await transport.request(new URL(url), 'GET', undefined, new Headers(), undefined);

                if (!res || (res.status && (res.status < 200 || res.status >= 300))) {
                    throw new Error(`HTTP ${res?.status}`);
                }

                const response = new Response(res.body, {
                    status: res.status,
                    statusText: res.statusText,
                    headers: res.headers
                });
                const blob = await response.blob();
                const reader = new FileReader();

                return new Promise((resolve) => {
                    reader.onload = () => {
                        window.parent.postMessage({
                            type: 'bg-proxy-response',
                            requestId,
                            success: true,
                            data: reader.result,
                            contentType: blob.type || 'image/jpeg'
                        }, '*');
                        resolve();
                    };
                    reader.onerror = () => {
                        window.parent.postMessage({
                            type: 'bg-proxy-response',
                            requestId,
                            success: false,
                            error: 'Failed to read blob'
                        }, '*');
                        resolve();
                    };
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error('[BG-Proxy] Failed to proxy image:', error);
                window.parent.postMessage({
                    type: 'bg-proxy-response',
                    requestId,
                    success: false,
                    error: error.message
                }, '*');
            }
        }

        window.addEventListener('message', async (e) => {
            if (e.data?.type === 'bg-proxy-request' && e.data.url && e.data.requestId) {
                await proxyImage(e.data.url, e.data.requestId);
            }
        });

        window.parent.postMessage({ type: 'bg-proxy-ready' }, '*');
    </script>
</body>

</html>
